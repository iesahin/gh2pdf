[package]
name = "gh2pdf"
version = "0.1.8"
edition = "2021"
description = "A GitHub App that converts issues and pull requests to PDFs and publishes them as release assets"
license = "MIT"

[lib]
name = "gh2pdf"
path = "src/lib.rs"

[[bin]]
name = "gh2pdf"
path = "src/main.rs"
required-features = ["server"]

[features]
default = ["server"]
# Everything beyond rendering: GitHub App authentication, release
# publishing, the conversion pipeline, the webhook server, and the binary.
# Turn it off (`default-features = false`) to depend on this crate purely as
# a PDF-rendering library.
server = [
    "dep:async-trait",
    "dep:axum",
    "dep:clap",
    "dep:dotenv",
    "dep:hex",
    "dep:hmac",
    "dep:jsonwebtoken",
    "dep:pretty_env_logger",
    "dep:sha2",
    "dep:toml",
]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "process", "time", "fs", "signal"] }

# `server` only.
async-trait = { version = "0.1", optional = true }
axum = { version = "0.8", optional = true }
clap = { version = "4.5", features = ["derive", "env"], optional = true }
dotenv = { version = "0.15", optional = true }
hex = { version = "0.4", optional = true }
hmac = { version = "0.12", optional = true }
jsonwebtoken = { version = "10", default-features = false, features = ["use_pem", "rust_crypto"], optional = true }
pretty_env_logger = { version = "0.5", optional = true }
sha2 = { version = "0.10", optional = true }
toml = { version = "0.8", optional = true }

[dev-dependencies]
tempfile = "3.10"
# `config`'s tests parse a repo config patch even without the `server` feature.
toml = "0.8"
