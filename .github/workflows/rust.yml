name: Rust Build & Test

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    - name: Format check
      run: cargo fmt --check

    - name: Clippy
      run: cargo clippy --all-targets -- -D warnings

    - name: Build
      run: cargo build --release

    - name: Test
      run: cargo test

    # inboxbot depends on this crate as a rendering library only; the
    # library half has to keep building and passing without the server.
    - name: Clippy (library only)
      run: cargo clippy --all-targets --no-default-features -- -D warnings

    - name: Test (library only)
      run: cargo test --no-default-features

    - name: Deploy script tests
      run: deploy/tests/deploy_sh_test.sh
