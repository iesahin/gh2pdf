[package]
name = "gh2pdf"
version = "0.1.0"
edition = "2021"
description = "A GitHub App that converts issues and pull requests to PDFs and publishes them as release assets"
license = "MIT"

[lib]
name = "gh2pdf"
path = "src/lib.rs"

[[bin]]
name = "gh2pdf"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
dotenv = "0.15"
hex = "0.4"
hmac = "0.12"
jsonwebtoken = "9"
log = "0.4"
pretty_env_logger = "0.5"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "process", "time", "fs", "signal"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3.10"
